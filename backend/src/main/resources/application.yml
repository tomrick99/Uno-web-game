spring:
  application:
    name: uno-game
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.railway.app,https://*.up.railway.app,https://*.onrender.com}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: lax
        name: JSESSIONID

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.railway.app,https://*.up.railway.app,https://*.onrender.com}

logging:
  level:
    com.uno: INFO
    org.springframework.web: INFO
