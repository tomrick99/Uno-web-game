<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO - 登录</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.5.0/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="app" v-cloak>
        <div class="bg-animation">
            <div class="circle c1"></div>
            <div class="circle c2"></div>
            <div class="circle c3"></div>
        </div>

        <div class="login-container">
            <div class="logo">
                <h1 class="uno-title">UNO</h1>
                <p class="subtitle">网页版本卡牌游戏</p>
            </div>

            <div v-if="!isRegister" class="form-card">
                <h2>登录</h2>
                <div class="input-group">
                    <input v-model="loginForm.username" type="text" placeholder="用户名" @keyup.enter="login">
                </div>
                <div class="input-group password-input">
                    <input v-model="loginForm.password"
                           :type="loginPasswordVisible ? 'text' : 'password'"
                           placeholder="密码"
                           autocomplete="current-password"
                           @keyup.enter="login">
                    <button type="button"
                            class="password-toggle"
                            :aria-label="loginPasswordVisible ? '隐藏登录密码' : '显示登录密码'"
                            :aria-pressed="loginPasswordVisible"
                            @click="loginPasswordVisible = !loginPasswordVisible">
                        {{ loginPasswordVisible ? '隐藏' : '显示' }}
                    </button>
                </div>
                <button class="btn-primary" @click="login">登录</button>
                <p class="switch-text">没有账号？<a @click="isRegister = true">立即注册</a></p>
                <p v-if="errorMsg" class="error-msg">{{ errorMsg }}</p>
            </div>

            <div v-else class="form-card">
                <h2>注册</h2>
                <div class="input-group">
                    <input v-model="registerForm.username" type="text" placeholder="用户名（3-20位）" @keyup.enter="register">
                </div>
                <div class="input-group password-input">
                    <input v-model="registerForm.password"
                           :type="registerPasswordVisible ? 'text' : 'password'"
                           placeholder="密码（6-32位）"
                           autocomplete="new-password"
                           @keyup.enter="register">
                    <button type="button"
                            class="password-toggle"
                            :aria-label="registerPasswordVisible ? '隐藏注册密码' : '显示注册密码'"
                            :aria-pressed="registerPasswordVisible"
                            @click="registerPasswordVisible = !registerPasswordVisible">
                        {{ registerPasswordVisible ? '隐藏' : '显示' }}
                    </button>
                </div>
                <button class="btn-primary" @click="register">注册</button>
                <p class="switch-text">已有账号？<a @click="isRegister = false">去登录</a></p>
                <p v-if="errorMsg" class="error-msg">{{ errorMsg }}</p>
                <p v-if="successMsg" class="success-msg">{{ successMsg }}</p>
            </div>
        </div>
    </div>

    <script src="js/pages/login.js"></script>
</body>
</html>
